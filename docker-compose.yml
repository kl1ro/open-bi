services:
  api:
    build:
      context: .
      secrets:
        - node_auth_token

    environment:
      PORT: 3000

    ports:
      - "3000:3000"

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: mip_bi
      POSTGRES_USER: mip_bi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN

volumes:
  postgres-data:
