stages:
  - test

test:
  stage: test
  image: node:20
  script:
    - echo "Testing app..."
    - npm ci
    - npm run build
  
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - echo "Connecting to server..."
    - sed -i 's|https://dl-cdn.alpinelinux.org/alpine|http://mirror.yandex.ru/mirrors/alpine|g' /etc/apk/repositories
    - apk add --no-cache openssh-client-default
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H $SERVER >> ~/.ssh/known_hosts
  script:
    - ssh $USER@$SERVER "cd $FOLDER && git pull origin main && npm ci && npm run build"
  only:
    - main
 