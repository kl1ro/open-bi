name: 'Test on real backend environment'
description: 'Runs vitest on real backend environment'

inputs:
  test_src:
    description: 'Path to the test files to run'
    required: true

runs:
  using: "composite"
  steps:
    - name: Test package from the app
      shell: bash
      working-directory: apps/back
      run: |
        cp .env.example .env
        set -a
        source .env
        set +a
        docker compose up -d --wait postgres
        docker build -f test.Dockerfile -t open-bi-back-test ../..
        docker run --rm \
          --network back_default \
          -e POSTGRES_USER \
          -e POSTGRES_PASSWORD \
          -e POSTGRES_DB \
          -e PORT \
          -e DATABASE_URL \
          -e REDIS_URL \
          -e SESSION_SECRET \
          -e COOKIE_SECURE \
          -e TRUST_PROXY \
          open-bi-back-test \
          sh -c "npx mikro-orm migration:up --config src/mikro-orm.config.ts && npx vitest run ${{ inputs.test_src }}"