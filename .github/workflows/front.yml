name: CI

on:
  push:

permissions:
  contents: read
  packages: read

defaults:
  run:
    working-directory: apps/front

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/front/package-lock.json
            packages/core/package-lock.json

      - working-directory: packages/core
        run: npm ci

      - working-directory: packages/core
        run: npm run build

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run lint

      - run: npm run build

  build:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/front
          build-contexts: |
            corepkg=packages/core
          push: ${{ github.ref == 'refs/heads/main' }}

          tags: |
            ghcr.io/kl1ro/open-bi-front:${{ github.sha }}
            ghcr.io/kl1ro/open-bi-front:latest

          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - run: echo "Deployment is not set up yet"
