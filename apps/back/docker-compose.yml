x-api-image: &api-image
  image: ghcr.io/kl1ro/mip-bi-back:${API_TAG:-latest}

  build:
    context: .
    secrets:
      - node_auth_token

x-database-url: &database-url
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  api:
    <<: *api-image
    env_file: .env

    environment:
      <<: *database-url

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

  migrate:
    <<: *api-image
    env_file: .env
    profiles: [migrate]
    command: ["npx", "mikro-orm", "migration:up", "--config", "dist/mikro-orm.config.js"]

    environment:
      <<: *database-url
      MIKRO_ORM_CLI_PREFER_TS: "false"

    depends_on:
      postgres:
        condition: service_healthy

  studio:
    image: ghcr.io/kl1ro/mip-bi-back-studio:${STUDIO_TAG:-latest}

    build:
      context: .
      dockerfile: studio.Dockerfile

    env_file: .env
    profiles: [studio]

    environment:
      <<: *database-url

    ports:
      - "127.0.0.1:5555:5556"

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:19

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/19/docker

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8

    volumes:
      - redis-data:/data

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN

volumes:
  postgres-data:
  redis-data:
